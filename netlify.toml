[build]
  publish = "."
  command = "echo 'no build'"
  functions = "netlify/functions"

[dev]
  port = 3000
  targetPort = 3000

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.sarvam.ai https://stt-rt.soniox.com; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:;"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
